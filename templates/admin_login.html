<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인</title>
  <style>
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;
      background:linear-gradient(135deg,#0f172a,#1e293b);
    }
    .card{
      width:min(92vw,420px);background:#fff;border-radius:24px;padding:28px;
      box-shadow:0 18px 48px rgba(0,0,0,.24);
    }
    h1{margin:0 0 10px;font-size:28px;letter-spacing:-0.03em;}
    p{margin:0 0 18px;color:#475569;line-height:1.6;}
    input{
      width:100%;padding:14px 16px;border:1px solid #cbd5e1;border-radius:14px;
      outline:none;font-size:16px;box-sizing:border-box;
    }
    button{
      width:100%;margin-top:12px;padding:14px 16px;border:none;border-radius:14px;
      background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:900;cursor:pointer;
    }
    .flash{
      margin-bottom:12px;padding:10px 12px;border-radius:12px;background:#fff1f2;color:#be123c;font-weight:700;
    }
    .hint{margin-top:14px;font-size:13px;color:#64748b;}
    code{background:#f8fafc;padding:2px 6px;border-radius:8px;}
  </style>
</head>
<body>
  <div class="card">
    <h1>관리자 로그인</h1>
    <p>당첨 이력 조회, 수령 처리, CSV 내보내기를 위해 로그인하세요.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    <form method="post">
      <input type="password" name="password" placeholder="관리자 비밀번호" />
      <button type="submit">로그인</button>
    </form>
    <div class="hint">기본 비밀번호는 <code>change-me</code>입니다. 운영 전 꼭 환경변수로 변경하세요.</div>
  </div>
</body>
</html>
